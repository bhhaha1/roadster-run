    * { margin: 0; padding: 0; box-sizing: border-box; }

      -webkit-tap-highlight-color: transparent;

    #screen { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
    #toast {
      position: fixed; left: 50%; top: 12px; transform: translate(-50%, -150%);

    }
    #toast.show { transform: translate(-50%, 0); }
    #rotate {
      position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; background: #000; color: #fff1e8; text-align: center; padding: 24px;
    }
    #rotate[hidden] { display: none; }
    #rotate .phone {
      width: 46px; height: 80px; border: 4px solid #fff1e8; border-radius: 8px; animation: turn 1.6s ease-in-out infinite;
    }
    @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
    #rotate p { font-size: 20px; font-weight: 700; }
    #rotate small { font-size: 14px; color: #c2c3c7; }
    #rotate button { margin-top: 8px; padding: 10px 16px; font-size: 14px; color: #c2c3c7; background: none; border: 1px solid #5f574f; border-radius: 6px; }
